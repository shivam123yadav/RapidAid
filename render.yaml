# ==============================================================================
# RapidAid Render Blueprint Configuration — Free Staging Environment
# ==============================================================================
# Declares both the Node.js Express Web Service (Backend) and the
# React/Vite Static Site (Frontend) on Render's Free tier for staging verification.
#
# NOTE: In Render Blueprint specifications, Static Sites are declared as:
#   type: web
#   runtime: static
# ==============================================================================

services:
  # ── Backend: RapidAid Express API Web Service (Free Staging Tier) ──────────
  - type: web
    name: rapidaid-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Critical Safety Rules: Keep false in staging & production
      - key: SEED_IF_EMPTY
        value: "false"
      - key: AUTOMATED_DISPATCH_ENABLED
        value: "false"
      - key: RATE_LIMIT_DISABLED
        value: "false"
      - key: LOG_LEVEL
        value: info
      # Dedicated Staging Database: Must point to separate 'rapidaid_staging' on MongoDB Atlas.
      # Must NEVER point to rapidaid_phase1_test or rapidaid_test. Set in Render Dashboard.
      - key: MONGODB_URI
        sync: false
      # Cryptographic Signing Secrets: Render generates secure 256-bit random strings
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      # CORS: Set to your exact deployed staging frontend URL (e.g. https://rapidaid-web.onrender.com)
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: COOKIE_SAME_SITE
        value: lax
      # Road Routing Provider: Default OSRM endpoint with haversine fallback
      - key: ROUTING_PROVIDER_TYPE
        value: osrm
      - key: ROUTING_PROVIDER_URL
        value: https://router.project-osrm.org
      # Transactional Email: Brevo HTTP API over HTTPS (bypasses Render SMTP port blocking)
      - key: EMAIL_TRANSPORT
        value: brevo_api
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: RapidAid Alerts <alerts@rapidaid-web.onrender.com>

  # ── Frontend: RapidAid React/Vite Static Site (Free Tier) ─────────────────
  - type: web
    name: rapidaid-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Single Page Application (SPA) rewrite: forwards all client routes to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # URL of the deployed staging backend Web Service (e.g. https://rapidaid-api.onrender.com)
      - key: VITE_API_BASE_URL
        sync: false
