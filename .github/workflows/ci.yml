name: RapidAid CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Frontend Typecheck
        run: npx tsc --noEmit

      - name: Backend Typecheck
        run: npm --prefix server run typecheck

      - name: Frontend Unit & Component Tests
        run: npx vitest run

      - name: Backend Integration & Safety Tests
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/rapidaid_phase1_test
          JWT_ACCESS_SECRET: test-access-secret-must-be-at-least-16-chars-001
          JWT_REFRESH_SECRET: test-refresh-secret-must-be-at-least-16-chars-002
          SEED_IF_EMPTY: 'false'
          RATE_LIMIT_DISABLED: 'true'
          LOG_LEVEL: silent
        run: npm --prefix server test

      - name: Build Frontend Production Bundle
        run: npm run build

      - name: Build Backend Production Bundle
        run: npm --prefix server run build

      - name: Validate Production Database Indexes against Clean MongoDB
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/rapidaid_phase1_test
          JWT_ACCESS_SECRET: test-access-secret-must-be-at-least-16-chars-001
          JWT_REFRESH_SECRET: test-refresh-secret-must-be-at-least-16-chars-002
          SEED_IF_EMPTY: 'false'
          RATE_LIMIT_DISABLED: 'true'
          LOG_LEVEL: silent
        run: npm --prefix server run db:verify-indexes

      - name: Verify Docker Container Build Integrity
        run: |
          docker build -t rapidaid-backend:test ./server
          docker build -t rapidaid-frontend:test .
