# Map incoming forwarded proto, or fall back to local connection scheme
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Map incoming client X-Request-ID or generate an Nginx request ID
map $http_x_request_id $request_id_to_forward {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Include system MIME types and ensure explicit mapping for ES module .mjs assets
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    # Defensive security response headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;

    # Content Security Policy (Report-Only Validation Stage)
    # - default-src 'self': Restrict fallbacks to same origin
    # - script-src 'self' 'wasm-unsafe-eval' 'sha256-...': Allow app bundle, WebAssembly JIT (whisper/ort), and verified inline theme flash guard
    # - style-src 'self' 'unsafe-inline' https://fonts.googleapis.com: Allow app styles, dynamic inline style mutations, and Google Fonts
    # - font-src 'self' https://fonts.gstatic.com data:: Allow local and Google Fonts
    # - img-src 'self' data: blob: https://*.tile.openstreetmap.org: Allow avatars, photos, base64 data URIs, and OSM map tiles
    # - connect-src 'self' blob: https://*.tile.openstreetmap.org: Allow API calls, blob downloads, and map tile fetches
    # - media-src 'self' blob:: Allow voice emergency audio playback
    # - worker-src 'self' blob:: Allow Web Workers for background speech processing
    # - object-src 'none': Block plugins like Flash/Java
    # - base-uri 'self': Prevent base tag hijacking
    # - frame-ancestors 'self': Prevent clickjacking in third-party iframes
    # - report-uri /api/csp-report: Collect violation telemetry without enforcing restrictions
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-iC72V1m9gSRP9UyOi1CcFfHXkkzX1amzDWf1PNZMoHM=' 'sha256-yYus43VadfK3oXWSYVcbzkPLH3ennhUxKvZm1U0ifrY='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' blob: https://*.tile.openstreetmap.org; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; report-uri /api/csp-report;" always;

    # SPA routing fallback: forward non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for backend API requests
    # Preserves the /api prefix and forwards host, client IP, and protocol headers
    # Preserves same-origin credentials and Path=/api/auth refresh cookies
    location /api/ {
        client_max_body_size 16m;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $request_id_to_forward;
    }
}

